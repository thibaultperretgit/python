[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "millennium-market-making-prep"
version = "0.1.0"
description = "Independent local market-making training environment"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "jupyterlab>=4", "nbformat>=5.9", "nbclient>=0.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["market_simulator*", "AmplifyQuantTrading*", "AmplifyArbitrageTrading*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
